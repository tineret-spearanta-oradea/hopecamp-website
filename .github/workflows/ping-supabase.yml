name: Ping Supabase to Prevent Pausing

on:
  schedule:
    # Runs at 9:00 AM UTC every Monday, Wednesday, and Friday
    # Increased frequency to ensure the project doesn't pause
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  ping_dev:
    name: Ping Dev Supabase
    runs-on: ubuntu-latest
    steps:
      # Step 1: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Use Node.js 18 or your preferred version

      # Step 2: Install Supabase Client
      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      # Step 3: Ping Dev Supabase by calling the update_ping function
      - name: Ping Dev Supabase
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }} # Your Dev Supabase project URL
          SUPABASE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }} # Your Dev Supabase service role key
        run: |
          node -e "
          (async () => {
            try {
              // Import Supabase client
              const { createClient } = require('@supabase/supabase-js');

              // Check if environment variables are set
              const supabaseUrl = process.env.SUPABASE_URL;
              const supabaseKey = process.env.SUPABASE_KEY;

              if (!supabaseUrl || !supabaseKey) {
                throw new Error('Supabase URL or Key is missing in environment variables.');
              }

              console.log('Dev Supabase URL:', supabaseUrl);
              console.log('Dev Supabase Key: Present');

              const supabase = createClient(supabaseUrl, supabaseKey);

              // First verify ping_status table exists by querying it
              console.log('Verifying ping_status table exists...');
              const { data: pingData, error: pingError } = await supabase
                .from('ping_status')
                .select('id, last_ping, ping_count')
                .eq('id', 1)
                .single();

              if (pingError) {
                console.error('Error querying ping_status table:', pingError);
                
                // Fallback to editions table if ping_status doesn't exist yet
                console.log('Falling back to editions table ping...');
                const { data, error } = await supabase.from('editions').select('id').limit(1);
                
                if (error) {
                  console.error('Fallback ping error:', error);
                  throw error;
                }
                
                console.log('Dev Ping successful via fallback. Received data:', data);
                return;
              }

              console.log('Found existing ping record:', pingData);

              // Try to call the update_ping function
              console.log('Calling update_ping function...');
              try {
                const { data, error } = await supabase.rpc('update_ping');
                
                if (error) {
                  console.error('Error calling update_ping function:', error);
                  throw error;
                }
                
                console.log('Dev Ping successful. Updated ping status:', data);
              } catch (funcError) {
                // If function call fails, try direct table update as fallback
                console.log('Function call failed, trying direct table update...');
                
                const currentTime = new Date().toISOString();
                const { data: updateData, error: updateError } = await supabase
                  .from('ping_status')
                  .update({ 
                    last_ping: currentTime,
                    ping_count: (pingData.ping_count || 0) + 1,
                    notes: `Updated directly via ping script at ${currentTime} due to function error`
                  })
                  .eq('id', 1)
                  .select();
                
                if (updateError) {
                  console.error('Direct update error:', updateError);
                  throw updateError;
                }
                
                console.log('Dev Ping successful via direct update. Updated data:', updateData);
              }
            } catch (err) {
              console.error('Error pinging Dev Supabase:', err.message);
              process.exit(1);
            }
          })();
          "

